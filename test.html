<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de prueba para validar conexión y respuesta de la API de GitHub.">
    <title>GitHub API - Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px; font-size: 14px; }
        button { cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        #results { margin-top: 20px; border: 1px solid #ddd; padding: 10px; border-radius: 4px; }
        .error { color: red; }
        .success { color: green; }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .skip-link {
            position: absolute;
            top: 0;
            left: 0;
            transform: translateY(-120%);
            background: #111827;
            color: #fff;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 0 0 6px 0;
        }
        .skip-link:focus,
        .skip-link:focus-visible {
            transform: translateY(0);
            outline: 3px solid #f59e0b;
        }
        input:focus-visible,
        button:focus-visible {
            outline: 3px solid #0366d6;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <a href="#mainContent" class="skip-link">Saltar al contenido principal</a>

    <header role="banner" class="container" style="margin-bottom: 12px;">
        <h1>🔧 GitHub API Test</h1>
    </header>

    <main id="mainContent" class="container" role="main" tabindex="-1">
        <section role="search" aria-label="Buscar repositorios por usuario">
            <label for="usuarioInput">Usuario</label>
            <input type="text" id="usuarioInput" placeholder="facebook" value="facebook" autocomplete="username" aria-describedby="userHelp">
            <button type="button" onclick="testBuscar()" aria-controls="results">Buscar Repos</button>
            <p id="userHelp" class="sr-only">Ingresa el usuario de GitHub y activa el botón para consultar repositorios.</p>
        </section>

        <section id="results" role="region" aria-label="Resultados de la prueba" aria-live="polite" aria-atomic="true" aria-busy="false" tabindex="-1"></section>
        <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./assets/js/config.js"></script>
    
    <script>
        // El token viene de config.js
        const TOKEN = GITHUB_TOKEN;

        async function testBuscar() {
            const results = document.getElementById('results');
            const announcer = document.getElementById('announcer');
            const usuario = document.getElementById('usuarioInput').value;

            results.setAttribute('aria-busy', 'true');
            announcer.textContent = `Buscando repositorios para ${usuario}`;
            
            results.innerHTML = '<p>Cargando...</p>';

            try {
                const response = await axios.get(`https://api.github.com/users/${usuario}/repos`, {
                    headers: { 'Authorization': `token ${TOKEN}` },
                    timeout: 10000
                });

                results.innerHTML = `
                    <p class="success">✅ Éxito! Encontré ${response.data.length} repos</p>
                    <pre>${JSON.stringify(response.data.slice(0, 2), null, 2)}</pre>
                `;
                announcer.textContent = `Búsqueda completada: ${response.data.length} repositorios encontrados`;
                results.focus();
            } catch (error) {
                results.innerHTML = `
                    <p class="error">❌ Error: ${error.message}</p>
                    <p>Status: ${error.response?.status}</p>
                `;
                announcer.textContent = `Error durante la búsqueda: ${error.message}`;
                results.focus();
            } finally {
                results.setAttribute('aria-busy', 'false');
            }
        }

        // Test automático al cargar
        window.addEventListener('load', () => {
            console.log('✅ Página cargada');
            document.getElementById('results').innerHTML = '<p class="success">✅ Página lista. Click en "Buscar Repos"</p>';
            document.getElementById('announcer').textContent = 'Página de pruebas lista para ejecutar búsqueda';
        });
    </script>
</body>
</html>
